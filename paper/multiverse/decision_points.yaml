# Decision-point registry for the AI jobs map paper.
#
# Every analytic choice in pipeline/ai_jobs_map is listed here, one entry per choice. Contributors own a point,
# research how others made the same choice, and propose alternatives (paper/multiverse/templates/proposal.md).
# The group decides which alternatives run; accepted ones run as branches (pipeline/multiverse, run with
# `python3 -I pipeline/run.py branch BR-nnnn`). Cut for reasons, never for results.
#
# Read with yaml.safe_load. Words such as yes, no, on and off are quoted, because YAML reads them as true and
# false. `python3 -I pipeline/run.py check-registry` checks this file against the config.
#
# Field guide
#   id               DP-nn, stable forever. A retired point keeps its id with status: closed.
#   title            Short name.
#   description      Plain language: what the choice is and why it matters.
#   current_value    What the pipeline does today (always a string). The rule only, never its result: counts
#                    and shares are results, which live in key_results.yaml and the run folders, and raters
#                    whose ratings aren't complete must not see them.
#   default_status   settled | provisional. Provisional = an open lead-author decision; the current value is
#                    the comparison point for branches until it is decided.
#   kind             config | mixed | hard-coded | dead-key | not-implemented, as found in the Phase 0 audit
#                    (before the Phase 2 refactor moved hard-coded choices into the config).
#   location         Where it lives: config key, or repo-relative file and function.
#   parameters       The config keys a branch may override for this point. For each:
#                      key           dotted path into pipeline/ai_jobs_map/config/config.json
#                      form          value (any value of the same type) | list (a list of the same element
#                                    type) | switch (only the listed variants, which are the ones the code
#                                    implements; a new variant is a code change, reviewed with its proposal)
#                      variants      for a switch
#                      allowed       for a list whose elements must come from a fixed set
#                      must_include  elements a list may not drop
#                      minimum       lowest number allowed
#                      origin        existing | new-in-phase-2 (was hard-coded) | wired-in-phase-2 (was a
#                                    config key the code never read)
#                    Locked and not-built points list their keys too, so an override of them is refused
#                    with the reason.
#   rationale        Why the current value was chosen, from the code and the jobs map reports. "Not recorded"
#                    means nobody wrote one down; finding the reason is a contributor task.
#   precedent        Published work that made this choice. Empty = not yet researched.
#   affects          Outputs that change when this changes.
#   analyses         ecosystem (ecosystem.json), firm-profiles (firms/*.json), crosswalk (SOC).
#   feeds_study      How this reaches the confirmatory firm-classifier study, if at all: sampling-frame,
#                    packet-content, label-space, baseline-b, ai-share-strata, indirect (changes role counts or
#                    AI share upstream), none.
#   locked           true = no branch may change it.
#   lock_reason      Why, if locked.
#   branchable       now | not-built | locked. not-built = nothing to vary yet.
#   owner            Contributor name once someone owns it (the /contribute skill sets it).
#   status           open | owned | closed.

- id: DP-01
  title: Counting unit (role key)
  description: What counts as one role. Postings at the same firm with the same normalised title and the same set
    of locations count once, however many boards or reposts carry them.
  current_value: firm + normalised title + normalised location set; text roles also split by a hash of the requirement
    text
  default_status: settled
  kind: hard-coded
  location: [pipeline/ai_jobs_map/core.py role_key(), pipeline/ai_jobs_map/build.py main() steps 1 and 3 (role keys)]
  parameters:
  - key: dedup.role_key_fields
    form: list
    allowed: [firm, title, locations]
    must_include: [firm]
    origin: new-in-phase-2
  - key: dedup.text_role_adds_text_hash
    form: switch
    variants: [true]
    origin: new-in-phase-2
  rationale: One job advertised many times should count once. Text roles also split by requirement text, so two
    different jobs sharing a title stay separate.
  precedent: []
  affects: [every role count, tiers, hiring shape, size proxy, all aggregates]
  analyses: [ecosystem, firm-profiles, crosswalk]
  feeds_study: indirect
  locked: false
  lock_reason: null
  branchable: now
  owner: null
  status: open

- id: DP-02
  title: Title normalisation for deduplication
  description: How job titles are cleaned before deciding two postings are the same role. Level words such as Senior
    and Junior are kept, so a senior and a junior opening are different roles.
  current_value: 'lowercase; keep letters, digits, + and #; keep level words; drop requisition tokens (regex in
    config) and a trailing -ft or -pt'
  default_status: settled
  kind: mixed
  location: ['config: dedup.requisition_token', pipeline/ai_jobs_map/core.py norm_role_title()]
  parameters:
  - {key: dedup.requisition_token, form: value, origin: existing}
  - key: dedup.keep_level_words
    form: switch
    variants: [true]
    origin: new-in-phase-2
  - {key: dedup.keep_chars, form: value, origin: new-in-phase-2}
  rationale: Senior and junior openings are different jobs. Requisition numbers would make one role look like many.
  precedent: []
  affects: [role counts]
  analyses: [ecosystem, firm-profiles]
  feeds_study: indirect
  locked: false
  lock_reason: null
  branchable: now
  owner: null
  status: open

